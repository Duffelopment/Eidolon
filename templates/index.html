<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ project_name }} – Living Portrait</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
  </head>
  <body class="min-h-screen bg-black text-slate-100 font-[Manrope]">
    <main class="relative flex min-h-screen flex-col items-center justify-center overflow-hidden">
      <div class="absolute inset-0 -z-10 bg-[radial-gradient(circle_at_top,_rgba(56,189,248,0.15),_transparent_55%)]"></div>
      <div class="flex flex-col items-center gap-12 px-4 text-center">
        <header class="space-y-2">
          <p class="text-sm uppercase tracking-[0.4em] text-cyan-200/70">A canvas that remembers</p>
          <h1 class="text-4xl font-light tracking-wide text-slate-50 md:text-6xl">
            {{ project_name }}
          </h1>
          <p class="max-w-2xl text-lg text-slate-300">
            Allow the portrait to study your voice, motion, and energy. Once it learns,
            speak with it and witness a luminous reflection that evolves alongside you.
          </p>
        </header>

        <section class="relative flex w-full max-w-3xl flex-col items-center gap-10">
          <div
            id="portrait-frame"
            class="group relative aspect-video w-full max-w-2xl overflow-hidden rounded-[3rem] border border-cyan-200/40 bg-gradient-to-br from-slate-900/80 via-slate-900/40 to-cyan-900/20 shadow-[0_0_60px_rgba(56,189,248,0.25)] transition-shadow duration-500"
          >
            <div class="absolute inset-0 animate-pulse bg-cyan-500/5 mix-blend-screen"></div>
            <canvas id="portrait-canvas" class="h-full w-full"></canvas>
            <video id="live-video" playsinline class="absolute inset-0 hidden h-full w-full object-cover opacity-0"></video>
            <div class="pointer-events-none absolute inset-0 border-[1px] border-cyan-300/20"></div>
          </div>

          <div class="flex flex-wrap items-center justify-center gap-6">
            <button
              id="learn-btn"
              class="rounded-full border border-cyan-300/40 bg-cyan-400/10 px-8 py-3 text-sm font-semibold uppercase tracking-[0.4em] text-cyan-100 transition hover:border-cyan-200 hover:bg-cyan-300/20"
            >
              Learn
            </button>
            <button
              id="talk-btn"
              class="rounded-full border border-purple-300/40 bg-purple-400/10 px-8 py-3 text-sm font-semibold uppercase tracking-[0.4em] text-purple-100 transition hover:border-purple-200 hover:bg-purple-300/20"
            >
              Talk
            </button>
          </div>

          <p id="status" class="max-w-xl text-sm text-slate-400 transition"></p>
        </section>
      </div>

      <footer class="absolute bottom-8 text-xs uppercase tracking-[0.4em] text-slate-500">
        Whisper to remember · Glow to respond
      </footer>
    </main>

    <audio id="response-audio" class="hidden"></audio>

    <script type="module" src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
